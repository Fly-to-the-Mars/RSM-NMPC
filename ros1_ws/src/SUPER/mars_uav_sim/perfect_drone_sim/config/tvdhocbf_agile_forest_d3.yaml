#############| For UAV simulation |#################################
pcd_name: "tvdhocbf_agile_forest_d3.pcd"
mesh_resource: "package://perfect_drone_sim/meshes/yunque-M.dae"
init_position:
  x: 0
  y: -50
  z: 1.5
init_yaw: 1.5708

#############|For LiDAR perception simulation |#################################
is_360lidar: true
polar_resolution: 0.35
downsample_res: 0.1
vertical_fov: 178.0
sensing_blind: 0.1
sensing_horizon: 20
sensing_rate: 10
print_time_consumption: false
lidar_type: 2
depth_image_en: false
